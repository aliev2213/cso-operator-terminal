services:
  - type: web
    name: overseer-bot
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python overseer_bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OVERSEER_TIMEZONE
        value: America/Toronto
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        value: https://wdjswfiiyywamzyhpnwl.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
