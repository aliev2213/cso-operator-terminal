name: OVERSEER 24/7 Cloud Heartbeat

on:
  schedule:
    # Runs every 15 minutes around the clock (00, 15, 30, 45 of every hour)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

concurrency:
  group: overseer-cloud-daemon
  cancel-in-progress: false

jobs:
  overseer-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute OVERSEER Cloud Audit & Stalker Loop
        run: |
          python overseer_bot.py --cron-sweep
          python overseer_bot.py --poll-once

      - name: Commit & Sync overseer_state.json Back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overseer_state.json overseer_local_state.json
          if git diff --staged --quiet; then
            echo "No state mutations occurred during this sweep."
          else
            git commit -m "chore(overseer): cloud state sync [skip ci]"
            git push
          fi
