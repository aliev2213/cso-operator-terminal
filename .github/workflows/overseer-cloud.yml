name: OVERSEER Always-On

# Runs OVERSEER continuously on GitHub's free runners (public repo = unlimited minutes).
# Each run lives ~5h50m and a new one is queued every hour, so there is always an instance
# long-polling Telegram, firing the 07:00/13:00/16:00/21:00 audits, midnight rollover and stalker pings.
# State lives on the `overseer-state` branch ([skip ci] commits -> no Vercel redeploys).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overseer-always-on
  cancel-in-progress: false

jobs:
  overseer:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      OVERSEER_RUN_SECONDS: '21000'
      STATE_WT: ${{ github.workspace }}/state-wt
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: overseer-state
          path: state-wt

      - name: Configure git identity
        run: |
          git config --global user.name "overseer-bot"
          git config --global user.email "overseer-bot@users.noreply.github.com"
          git -C state-wt config user.name "overseer-bot"
          git -C state-wt config user.email "overseer-bot@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run OVERSEER (always-on loop)
        run: python overseer_bot.py --actions-loop
