name: Render 24/7 Keep-Alive

on:
  schedule:
    # Runs every 5 minutes around the clock to permanently prevent Render Free tier from sleeping
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      render_url:
        description: 'Render Service URL to ping (optional override)'
        required: false
        default: 'https://overseer-backend-w9uu.onrender.com'

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Service (Keep-Alive)
        env:
          RENDER_URL: ${{ secrets.RENDER_URL || vars.RENDER_URL || inputs.render_url || 'https://overseer-backend-w9uu.onrender.com' }}
        run: |
          TARGET="${RENDER_URL:-https://overseer-backend-w9uu.onrender.com}"
          CLEAN_URL="${TARGET%/}"
          echo "Pinging live Render service at $CLEAN_URL/health ..."
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "$CLEAN_URL/health" || true)
            echo "Attempt $i: Health endpoint response code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Render keep-alive verified healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Fallback pinging root URL..."
          curl -s -m 45 "$CLEAN_URL/" > /dev/null || true
          echo "Render keep-alive ping routine complete."
