name: Render 24/7 Keep-Alive & Cloud Watchdog

on:
  schedule:
    # Runs every 10 minutes around the clock to prevent Render Free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      render_url:
        description: 'Render Service URL to ping (optional override)'
        required: false
        default: ''

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Service
        env:
          RENDER_URL: ${{ secrets.RENDER_URL || vars.RENDER_URL || inputs.render_url }}
        run: |
          TARGET="${RENDER_URL}"
          if [ -z "$TARGET" ]; then
            # Default fallback candidates
            TARGET="https://overseer-bot.onrender.com"
          fi
          CLEAN_URL="${TARGET%/}"
          echo "Pinging Render service at $CLEAN_URL/health ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$CLEAN_URL/health" || true)
          echo "Health endpoint response code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Attempting root URL ping..."
            curl -s -m 30 "$CLEAN_URL/" > /dev/null || true
          fi
          echo "Render keep-alive ping dispatched."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cloud Watchdog Sweep (Schedules & Stalker Loop)
        env:
          TELEGRAM_BOT_TOKEN: '8888328816:AAE5ipRKVSwKMShGTiTFCD9rP1Jkq5GtlZM'
          TELEGRAM_CHAT_ID: '5441024587'
        run: |
          python overseer_bot.py --cron-sweep || true
